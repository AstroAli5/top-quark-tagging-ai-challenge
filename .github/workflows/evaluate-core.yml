name: Evaluate preserved core checkpoints
on:
  workflow_dispatch:
  push:
    branches: ['codex/research-release']
    paths: ['.github/workflows/evaluate-core.yml']
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
          run-id: 35094350524
          github-token: ${{ github.token }}
      - run: python scripts/verify_prepared.py
      - uses: actions/download-artifact@v4
        with:
          name: research-seed-${{ matrix.seed }}
          path: runs/core_${{ matrix.seed }}/
          run-id: 35042290356
          github-token: ${{ github.token }}
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
      - uses: matlab-actions/run-command@v2
        with:
          command: setupProject; recoverInitialCore(${{ matrix.seed }})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-core-seed-${{ matrix.seed }}
          path: |
            runs/core_${{ matrix.seed }}/results/
            runs/core_${{ matrix.seed }}/models/
          retention-days: 90
  summarize:
    needs: evaluate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: research-core-seed-*
          path: downloads/
      - run: python scripts/summarize_experiment.py --input downloads --output core-results
      - uses: actions/upload-artifact@v4
        with:
          name: core-summary
          path: core-results/
          retention-days: 90
