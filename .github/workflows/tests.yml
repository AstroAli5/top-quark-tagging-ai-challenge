name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  quantum:
    name: Optional quantum simulator checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-quantum.txt
      - run: python -m pip install -r requirements-quantum.txt
      - run: python -m unittest discover -s tests -p 'test_quantum_pilot.py' -v

  converter:
    name: Python dataset converter
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  matlab:
    name: MATLAB R2024a pipeline
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read existing public checkpoints for verification only
        uses: actions/download-artifact@v4
        with:
          name: research-core-seed-101
          run-id: '35095505566'
          github-token: ${{ github.token }}
          path: downloads/check-core
      - uses: actions/download-artifact@v4
        with:
          name: research-reference-seed-101
          run-id: '35148856141'
          github-token: ${{ github.token }}
          path: downloads/check-reference
      - run: |
          cp downloads/check-core/models/graphsage_model.mat checkpoints/seed-101/
          cp downloads/check-reference/models/winner_reference.mat checkpoints/seed-101/
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
          test-results-junit: test-results/matlab.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-test-results
          path: test-results/
          if-no-files-found: ignore
