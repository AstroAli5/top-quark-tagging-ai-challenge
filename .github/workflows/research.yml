name: Official-partition research study
# Implementation functions live only in src/ so root commands resolve them correctly.
on:
  workflow_dispatch:
  push:
    branches: ['codex/research-release']
    paths: ['.github/workflows/research.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/*.h5
          key: zenodo-2603256-official-v1
      - run: python scripts/prepare_official.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
          retention-days: 7
  experiment:
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: run_experiment(${{ matrix.seed }})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-seed-${{ matrix.seed }}
          path: |
            runs/seed_${{ matrix.seed }}/results/
            runs/seed_${{ matrix.seed }}/models/
          retention-days: 90
  summarize:
    needs: experiment
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: research-seed-*
          path: downloads/
      - run: python scripts/summarize_experiment.py --input downloads --output study-results
      - uses: actions/upload-artifact@v4
        with:
          name: research-summary
          path: study-results/
          retention-days: 90
