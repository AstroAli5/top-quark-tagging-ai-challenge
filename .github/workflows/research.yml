name: Official-partition research study
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-tests@v3
        with:
          source-folder: .
          select-by-folder: tests
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/*.h5
          key: zenodo-2603256-official-v1
      - run: python scripts/prepare_official.py
      - run: python scripts/verify_prepared.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
          retention-days: 30
  core:
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: run_experiment(${{ matrix.seed }},'data/official','runs/core_${{ matrix.seed }}',struct('experimentModels',{{'CNN','GraphSAGE'}}))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-core-seed-${{ matrix.seed }}
          path: |
            runs/core_${{ matrix.seed }}/results/
            runs/core_${{ matrix.seed }}/models/
          retention-days: 90
  reference:
    needs: [validate, prepare]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: run_experiment(${{ matrix.seed }},'data/official','runs/reference_${{ matrix.seed }}',struct('experimentModels',{{'ResNeXt-SE reference'}}))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-reference-seed-${{ matrix.seed }}
          path: |
            runs/reference_${{ matrix.seed }}/results/
            runs/reference_${{ matrix.seed }}/models/
          retention-days: 90
  summarize-core:
    needs: core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: research-core-seed-*
          path: downloads/
      - run: python scripts/summarize_experiment.py --input downloads --output core-results
      - uses: actions/upload-artifact@v4
        with:
          name: core-summary
          path: core-results/
          retention-days: 90
  summarize:
    needs: [core, reference]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: research-*-seed-*
          path: downloads/
      - run: python scripts/combine_study_runs.py --input downloads --output combined
      - run: python scripts/summarize_experiment.py --input combined --output study-results
      - uses: actions/upload-artifact@v4
        with:
          name: research-summary
          path: study-results/
          retention-days: 90
