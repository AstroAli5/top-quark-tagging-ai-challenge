name: Evaluate preserved reference checkpoints
on:
  workflow_dispatch:
  push:
    branches: ['codex/research-release']
    paths: ['.github/workflows/evaluate-reference.yml']
permissions:
  contents: read
  actions: read
jobs:
  wait-for-training:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Wait for the existing training run to preserve its models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            study_status="$(gh run view 35094350524 --repo AstroAli5/top-quark-tagging-ai-challenge --json status --jq .status)"
            if [ "$study_status" = completed ]; then break; fi
            sleep 60
          done
  evaluate:
    needs: wait-for-training
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: official-prepared-data
          path: data/official/
          run-id: 35094350524
          github-token: ${{ github.token }}
      - run: python scripts/verify_prepared.py
      - uses: actions/download-artifact@v4
        with:
          name: research-reference-seed-${{ matrix.seed }}
          path: runs/reference_${{ matrix.seed }}/
          run-id: 35094350524
          github-token: ${{ github.token }}
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Deep_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: setupProject; recoverReference(${{ matrix.seed }})
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-reference-seed-${{ matrix.seed }}
          path: |
            runs/reference_${{ matrix.seed }}/results/
            runs/reference_${{ matrix.seed }}/models/
          retention-days: 90
  summarize:
    needs: evaluate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: research-reference-seed-*
          path: downloads/
      - uses: actions/download-artifact@v4
        with:
          pattern: research-core-seed-*
          path: downloads/
          run-id: 35095505566
          github-token: ${{ github.token }}
      - run: python scripts/combine_study_runs.py --input downloads --output combined
      - run: python scripts/summarize_experiment.py --input combined --output study-results
      - uses: actions/upload-artifact@v4
        with:
          name: research-summary
          path: study-results/
          retention-days: 90
